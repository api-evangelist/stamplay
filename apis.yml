name: Stamplay
description: >-
  Stamplay was a backend-as-a-service and API-integration platform — billed as
  "Lego for developers" — founded in 2012 (Turin, Italy; later San Francisco)
  and backed by 500 Global. It let developers assemble application backends by
  visually wiring together third-party APIs, authentication providers, hosted
  data objects, webhooks, and static site hosting on stamplayapp.com, driven by a
  JavaScript SDK, a Node.js SDK, and the `stamplay` CLI. The product has been
  discontinued: the company was acquired (widely reported as Apple, 2019), the
  stamplay.com domain is now held via MarkMonitor and returns no HTTP response,
  every source repository in the GitHub organization is archived, and the npm
  SDK/CLI packages were last published in 2016. This API Evangelist profile
  preserves the historical developer footprint (SDKs and CLI) rather than a live
  API surface.
